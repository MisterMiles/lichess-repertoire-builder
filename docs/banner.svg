<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="lichess repertoire builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14171c"/>
      <stop offset="1" stop-color="#1d232c"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14171c" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#14171c" stop-opacity="0.95"/><stop offset="0.8" stop-color="#14171c" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#14171c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="board" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#232a34"/>
      <rect width="40" height="40" fill="#2c3542"/>
      <rect x="40" y="40" width="40" height="40" fill="#2c3542"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- Brett im Hintergrund, nach links ausgeblendet -->
  <rect x="0" y="0" width="1280" height="640" fill="url(#board)" opacity="0.55"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#fade)"/>

  <!-- Zugbaum -->
  <g fill="none" stroke-linecap="round">
    <path d="M700 320 C 800 320, 820 180, 920 180" stroke="#3987e5" stroke-width="10"/>
    <path d="M700 320 C 800 320, 820 320, 920 320" stroke="#3987e5" stroke-width="6" opacity="0.85"/>
    <path d="M700 320 C 800 320, 820 460, 920 460" stroke="#3987e5" stroke-width="4" opacity="0.7"/>
    <path d="M920 180 C 1000 180, 1010 110, 1090 110" stroke="#3987e5" stroke-width="7"/>
    <path d="M920 180 C 1000 180, 1010 230, 1090 230" stroke="#3987e5" stroke-width="4" opacity="0.8"/>
    <path d="M920 320 C 1000 320, 1010 300, 1090 300" stroke="#3987e5" stroke-width="5" opacity="0.85"/>
    <path d="M920 320 C 1000 320, 1010 380, 1090 380" stroke="#e66767" stroke-width="3" stroke-dasharray="2 9"/>
    <path d="M920 460 C 1000 460, 1010 520, 1090 520" stroke="#3987e5" stroke-width="3" opacity="0.7"/>
    <path d="M1090 110 L 1190 90" stroke="#1baf7a" stroke-width="4"/>
    <path d="M1090 230 L 1190 250" stroke="#1baf7a" stroke-width="3" opacity="0.8"/>
    <path d="M1090 300 L 1190 300" stroke="#1baf7a" stroke-width="3" opacity="0.8"/>
  </g>
  <g fill="#f0efec">
    <circle cx="700" cy="320" r="14"/>
    <circle cx="920" cy="180" r="11"/><circle cx="920" cy="320" r="10"/><circle cx="920" cy="460" r="9"/>
    <circle cx="1090" cy="110" r="8"/><circle cx="1090" cy="230" r="7"/><circle cx="1090" cy="300" r="7"/>
    <circle cx="1090" cy="520" r="6"/>
  </g>
  <circle cx="1090" cy="380" r="9" fill="#e66767"/>
  <text x="1104" y="386" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#e66767">??</text>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#c3c2b7">
    <text x="800" y="170">47 %</text>
    <text x="800" y="312">26 %</text>
    <text x="800" y="452">11 %</text>
  </g>
  <g fill="#1baf7a" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700">
    <text x="1200" y="97">+0,4</text>
    <text x="1200" y="257">=</text>
    <text x="1200" y="307">+0,8</text>
  </g>

  <!-- Titel -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="80" y="250" font-size="64" font-weight="800" fill="#f0efec">lichess</text>
    <text x="80" y="325" font-size="64" font-weight="800" fill="#f0efec">repertoire</text>
    <text x="80" y="400" font-size="64" font-weight="800" fill="#3987e5">builder</text>
    <text x="82" y="460" font-size="24" fill="#c3c2b7">Opening repertoires from real games and Stockfish</text>
    <text x="82" y="495" font-size="24" fill="#898781">Eröffnungsrepertoires aus echten Partien und Stockfish</text>
  </g>
</svg>
